# -- Kubernetes cluster domain
kubernetesClusterDomain: cluster.local
# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified app name
fullnameOverride: ""

# -- Namespace to deploy resources into
namespace: ""
# -- Whether to create the namespace resource
createNamespace: false
# -- Labels to apply to the created namespace
namespaceLabels: {}

## Image parameters
image:
  # -- Container image registry
  registry: ghcr.io
  # -- Container image repository
  repository: ""
  # -- Container image digest (takes precedence over tag)
  digest: ""
  # -- Container image tag (defaults to chart appVersion)
  tag: ""
  # -- Image pull policy
  pullPolicy: Always
  # -- List of image pull secret names
  pullSecrets: []

# -- Number of pod replicas
replicaCount: 1

## Security parameters
podSecurityContext:
  # -- Require non-root user
  runAsNonRoot: true
  # -- User ID to run as
  runAsUser: 65534
  # -- Group ID to run as
  runAsGroup: 65534
  # -- Group ID for filesystem access
  fsGroup: 65534

containerSecurityContext:
  # -- Require non-root user
  runAsNonRoot: true
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Mount root filesystem as read-only
  readOnlyRootFilesystem: true
  capabilities:
    # -- Linux capabilities to drop
    drop:
      - ALL

## Resource parameters
resources:
  limits:
    # -- Memory limit
    memory: 512Mi
  requests:
    # -- CPU request
    cpu: 10m
    # -- Memory request
    memory: 256Mi

## Startup probe parameters
startupProbe:
  # -- Enable startup probe
  enabled: true
  # -- HTTP path for startup check
  path: /lib/health/start
  # -- Port name or number for startup check
  port: http
  # -- Delay before first probe
  initialDelaySeconds: 5
  # -- Interval between probes
  periodSeconds: 10
  # -- Probe timeout
  timeoutSeconds: 5
  # -- Failures before marking unhealthy
  failureThreshold: 30
  # -- Successes before marking healthy
  successThreshold: 1

## Readiness probe parameters
readinessProbe:
  # -- Enable readiness probe
  enabled: true
  # -- HTTP path for readiness check
  path: /lib/health/ready
  # -- Port name or number for readiness check
  port: http
  # -- Delay before first probe
  initialDelaySeconds: 5
  # -- Interval between probes
  periodSeconds: 10
  # -- Probe timeout
  timeoutSeconds: 5
  # -- Failures before marking unready
  failureThreshold: 3
  # -- Successes before marking ready
  successThreshold: 1

## Liveness probe parameters
livenessProbe:
  # -- Enable liveness probe
  enabled: true
  # -- HTTP path for liveness check
  path: /lib/health/ready
  # -- Port name or number for liveness check
  port: http
  # -- Delay before first probe
  initialDelaySeconds: 10
  # -- Interval between probes
  periodSeconds: 10
  # -- Probe timeout
  timeoutSeconds: 5
  # -- Failures before restarting
  failureThreshold: 6
  # -- Successes before marking healthy
  successThreshold: 1

## Service parameters
service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Service and container port
  port: 4000

## Ingress parameters (DEPRECATED — use `gateway`)
ingress:
  # -- DEPRECATED (use `gateway.enabled`): Enable ingress
  enabled: true
  # -- DEPRECATED (use `gateway.parentRefs`): Ingress class name
  ingressClassName: nginx
  # -- DEPRECATED (the Gateway listener owns TLS): cert-manager ClusterIssuer name
  certIssuer: cert-manager-global
  # -- DEPRECATED (use `gateway.hostnames`): List of ingress hostnames
  hosts: []
  # -- DEPRECATED (use `gateway.annotations`): Additional ingress annotations (merged with chart defaults)
  annotations: {}

## Internal Ingress parameters (DEPRECATED — use `gateway.internal`)
internalIngress:
  # -- DEPRECATED (use `gateway.internal.enabled`): Enable internal ingress with IP whitelisting
  enabled: false
  # -- DEPRECATED (use `gateway.internal.allowedCidrs`): Comma-separated CIDR ranges allowed to access internal endpoints
  whitelistSourceRange: ""

## Gateway API parameters (NGINX Gateway Fabric)
gateway:
  # -- Enable HTTPRoute (Gateway API). Replaces the deprecated `ingress`
  enabled: false
  # -- Gateways to attach the HTTPRoute to (name, namespace, sectionName). The Gateway itself, its TLS listener and its certificate are not managed by this chart
  parentRefs:
    - name: nginx
      namespace: nginx-gateway
      sectionName: https
  # -- List of hostnames served by the HTTPRoute (empty matches every hostname of the Gateway listener)
  hostnames: []
  # -- Additional HTTPRoute annotations
  annotations: {}
  # -- Per-rule HTTPRoute timeouts (`request`, `backendRequest`); set to `null` to use NGINX defaults
  timeouts:
    request: 900s
    backendRequest: 900s
  internal:
    # -- Enable the `/api/internal` route restricted by an NGF SnippetsFilter IP allowlist. Requires NGF installed with snippets filters enabled
    enabled: false
    # -- CIDR ranges allowed to reach `/api/internal`. Empty means deny all
    allowedCidrs: []
  clientSettings:
    # -- Enable the NGF ClientSettingsPolicy targeting the HTTPRoute
    enabled: true
    # -- Maximum client request body size
    maxBodySize: 15m
    # -- Client request body read timeout
    bodyTimeout: 60s

## Headless Service parameters
headlessService:
  # -- Enable headless service for pod discovery
  enabled: true

## ConfigMap parameters
configMap:
  # -- Key-value pairs injected as environment variables via ConfigMap
  env: {}

## Secret parameters
secret:
  # -- Arbitrary key-value pairs rendered as a Kubernetes Secret (values are base64-encoded automatically)
  data: {}

## ServiceAccount parameters
serviceAccount:
  # -- Name of an existing ServiceAccount to run the pod as. Empty uses the namespace default. The ServiceAccount is not created here: GKE Workload Identity needs it annotated with a Google service account email that only the infrastructure layer knows
  name: ""
  # -- Mount the ServiceAccount token into the pod. Required by GKE Workload Identity
  automount: false

## External Secrets parameters
secretStore:
  # -- Enable SecretStore and ServiceAccount for vault integration
  enabled: false
  # -- SecretStore name
  name: ""
  # -- Vault/OpenBao server URL
  server: ""
  # -- CA provider for TLS verification (type, name, key)
  caProvider: {}
  auth:
    # -- Kubernetes auth role for vault
    role: ""

# -- List of ExternalSecret definitions
externalSecrets: []

## Extra parameters

# -- Additional environment variables
extraEnvVars: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts
extraVolumeMounts: []
# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}
