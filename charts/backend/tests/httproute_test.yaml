suite: backend httproute
release:
  name: my
templates:
  - httproute.yaml
set:
  gateway.listenerSet.name: shared
tests:
  - it: renders nothing unless gateway.enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: attaches to the configured gateway and service
    set:
      gateway.enabled: true
      gateway.hostnames:
        - api.example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: my-backend-backend
      - equal:
          path: spec.parentRefs
          value:
            - group: gateway.networking.k8s.io
              kind: ListenerSet
              name: shared
      - equal:
          path: spec.hostnames[0]
          value: api.example.com
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: my-backend-backend
            port: 4000
      - equal:
          path: spec.rules[0].timeouts.request
          value: 900s

  - it: attaches to its own ListenerSet when it creates one
    set:
      gateway.enabled: true
      gateway.listenerSet.create: true
      gateway.listenerSet.name: null
      gateway.hostnames:
        - api.example.com
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-backend-backend

  - it: fails without a ListenerSet to attach to
    set:
      gateway.enabled: true
      gateway.listenerSet.name: null
    asserts:
      - failedTemplate:
          errorMessage: gateway.listenerSet.name is required unless gateway.listenerSet.create is true

  - it: rewrites /api to / like the deprecated ingress rewrite-target
    set:
      gateway.enabled: true
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /api
      - equal:
          path: spec.rules[0].filters[0].urlRewrite.path
          value:
            type: ReplacePrefixMatch
            replacePrefixMatch: /
      - lengthEqual:
          path: spec.rules[0].filters
          count: 1

  - it: adds the allowlisted internal rule when gateway.nginx.internal.enabled
    set:
      gateway.enabled: true
      gateway.nginx.internal.enabled: true
      gateway.nginx.internal.allowedCidrs:
        - 10.224.0.0/14
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api/internal
      - equal:
          path: spec.rules[0].filters[0].urlRewrite.path.replacePrefixMatch
          value: /internal
      # Must match the name in snippets-filter.yaml, or NGF drops the route
      - equal:
          path: spec.rules[0].filters[1].extensionRef
          value:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: my-backend-backend-internal
      - equal:
          path: spec.rules[1].matches[0].path.value
          value: /api

  - it: omits hostnames when unset and timeouts when nulled
    set:
      gateway.enabled: true
      gateway.timeouts: null
    asserts:
      - isNull:
          path: spec.hostnames
      - isNull:
          path: spec.rules[0].timeouts

  # The internal rule references the NGF SnippetsFilter, so it must go with it
  - it: drops the internal rule when the nginx extensions are off
    set:
      gateway.enabled: true
      gateway.nginx.enabled: false
      gateway.nginx.internal.enabled: true
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api
