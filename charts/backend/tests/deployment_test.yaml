suite: backend deployment service account
release:
  name: my
templates:
  - deployment.yaml
tests:
  - it: uses an image digest when configured
    set:
      image.registry: registry.example.com
      image.repository: arkemis/backend
      image.tag: v1.2.3
      image.digest: sha256:0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/arkemis/backend@sha256:0123456789abcdef

  - it: keeps using the image tag by default
    set:
      image.registry: registry.example.com
      image.repository: arkemis/backend
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/arkemis/backend:v1.2.3

  - it: runs as the namespace default with no token by default
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: runs as the named service account
    set:
      serviceAccount.name: phylo-dev-app
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: phylo-dev-app

  - it: mounts the token when asked, which is what Workload Identity needs
    set:
      serviceAccount.automount: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: keeps mounting the token for secret store users
    set:
      secretStore.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
