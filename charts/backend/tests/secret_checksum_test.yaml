suite: backend secret checksum
release:
  name: my
templates:
  - deployment.yaml
  # Rendered through include by the checksum annotation
  - secret.yaml
tests:
  - it: rolls the pod when a secret value changes
    set:
      secret.data:
        API_KEY: one
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/secret"]
        template: deployment.yaml

  - it: omits the secret checksum without secret data
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret"]
        template: deployment.yaml
