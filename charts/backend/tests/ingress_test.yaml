suite: backend ingress (deprecated)
release:
  name: my
templates:
  - ingress.yaml
  - internal-ingress.yaml
tests:
  - it: still renders the public ingress by default
    template: ingress.yaml
    set:
      ingress.hosts:
        - api.example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api/(?P<capture>.+)
      - isSubset:
          path: metadata.annotations
          content:
            nginx.ingress.kubernetes.io/rewrite-target: /$capture
            nginx.ingress.kubernetes.io/server-snippet: |
              if ($uri ~* "^/(api/)?lib/auth/super_admin/signup(/|$)") {
                return 403;
              }

  - it: preserves custom server snippets alongside the signup block
    template: ingress.yaml
    set:
      ingress.annotations:
        nginx.ingress.kubernetes.io/server-snippet: add_header X-Test preserved;
        example.com/custom: preserved
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            example.com/custom: preserved
            nginx.ingress.kubernetes.io/server-snippet: |
              if ($uri ~* "^/(api/)?lib/auth/super_admin/signup(/|$)") {
                return 403;
              }
              add_header X-Test preserved;

  - it: omits nginx snippets for other ingress controllers
    template: ingress.yaml
    set:
      ingress.ingressClassName: other
    asserts:
      - isNull:
          path: metadata.annotations["nginx.ingress.kubernetes.io/server-snippet"]

  - it: still renders the internal ingress with the source-range whitelist
    template: internal-ingress.yaml
    set:
      ingress.hosts:
        - api.example.com
      internalIngress.enabled: true
      internalIngress.whitelistSourceRange: 10.224.0.0/14
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api/internal/(?P<capture>.+)
      - isSubset:
          path: metadata.annotations
          content:
            nginx.ingress.kubernetes.io/whitelist-source-range: 10.224.0.0/14
