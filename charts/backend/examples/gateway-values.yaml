# NGINX Gateway Fabric: public /api route + internal-only /api/internal allowlist.
#
# Cluster prerequisites:
#   * Gateway API CRDs and NGINX Gateway Fabric installed
#   * a Gateway (not created by this chart) with an HTTPS listener whose hostname covers
#     gateway.hostnames below, and whose TLS certificate is issued there
#   * NGF snippets filters enabled, only if gateway.internal is used:
#     helm upgrade ... --set nginxGateway.snippetsFilters.enable=true
#
#   helm install my-backend arkemis/backend -f gateway-values.yaml

image:
  repository: arkemishub/backend
  tag: "1.0.0"

gateway:
  enabled: true
  parentRefs:
    - name: nginx
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - api.example.com
  internal:
    enabled: true
    allowedCidrs:
      - 10.224.0.0/14

# Turn the deprecated Ingress off once the HTTPRoute is serving traffic.
ingress:
  enabled: false
