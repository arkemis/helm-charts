suite: frontend httproute
release:
  name: my
templates:
  - httproute.yaml
set:
  gateway.listenerSet.name: shared
tests:
  - it: renders nothing unless gateway.enabled
    asserts:
      - hasDocuments:
          count: 0

  - it: serves the whole hostname from the frontend service
    set:
      gateway.enabled: true
      gateway.hostnames:
        - app.example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: my-frontend-frontend
      - equal:
          path: spec.parentRefs
          value:
            - group: gateway.networking.k8s.io
              kind: ListenerSet
              name: shared
      - equal:
          path: spec.hostnames[0]
          value: app.example.com
      - lengthEqual:
          path: spec.rules
          count: 1
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: my-frontend-frontend
            port: 3000
      - equal:
          path: spec.rules[0].timeouts.request
          value: 900s

  - it: attaches to its own ListenerSet when it creates one
    set:
      gateway.enabled: true
      gateway.listenerSet.create: true
      gateway.listenerSet.name: null
      gateway.hostnames:
        - app.example.com
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: my-frontend-frontend

  - it: fails without a ListenerSet to attach to
    set:
      gateway.enabled: true
      gateway.listenerSet.name: null
    asserts:
      - failedTemplate:
          errorMessage: gateway.listenerSet.name is required unless gateway.listenerSet.create is true

  - it: does not rewrite the path
    set:
      gateway.enabled: true
    asserts:
      - isNull:
          path: spec.rules[0].filters
