# Gateway API: serves the whole hostname from the frontend Service.
#
# Attaches to the ListenerSet the backend release creates for the same hostnames
# (see ../../backend/examples/gateway-values.yaml), so it requests no listener or
# certificate itself. Set gateway.listenerSet.create instead to deploy it standalone.
#
#   helm install my-frontend arkemis/frontend -f gateway-values.yaml

image:
  repository: arkemishub/frontend
  tag: "1.0.0"

gateway:
  enabled: true
  hostnames:
    - app.example.com
    - www.app.example.com
  listenerSet:
    name: my-app

# Turn the deprecated Ingress off once the HTTPRoute is serving traffic.
ingress:
  enabled: false
