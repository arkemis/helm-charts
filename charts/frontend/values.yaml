# -- Kubernetes cluster domain
kubernetesClusterDomain: cluster.local
# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified app name
fullnameOverride: ""

# -- Namespace to deploy resources into
namespace: ""
# -- Whether to create the namespace resource
createNamespace: false
# -- Labels to apply to the created namespace
namespaceLabels: {}

## Image parameters
image:
  # -- Container image registry
  registry: ghcr.io
  # -- Container image repository
  repository: ""
  # -- Container image digest (takes precedence over tag)
  digest: ""
  # -- Container image tag (defaults to chart appVersion)
  tag: ""
  # -- Image pull policy
  pullPolicy: Always
  # -- List of image pull secret names
  pullSecrets: []

# -- Number of pod replicas
replicaCount: 1

## Security parameters
podSecurityContext:
  # -- Require non-root user
  runAsNonRoot: true
  # -- User ID to run as
  runAsUser: 1001
  # -- Group ID to run as
  runAsGroup: 1001
  # -- Group ID for filesystem access
  fsGroup: 1001

containerSecurityContext:
  # -- Require non-root user
  runAsNonRoot: true
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Mount root filesystem as read-only
  readOnlyRootFilesystem: true
  capabilities:
    # -- Linux capabilities to drop
    drop:
      - ALL

## Resource parameters
resources:
  limits:
    # -- Memory limit
    memory: 256Mi
  requests:
    # -- CPU request
    cpu: 5m
    # -- Memory request
    memory: 128Mi

## Startup probe parameters
startupProbe:
  # -- Enable startup probe
  enabled: true
  # -- HTTP path for startup check
  path: /
  # -- Port name or number for startup check
  port: http
  # -- Delay before first probe
  initialDelaySeconds: 5
  # -- Interval between probes
  periodSeconds: 10
  # -- Probe timeout
  timeoutSeconds: 5
  # -- Failures before marking unhealthy
  failureThreshold: 30
  # -- Successes before marking healthy
  successThreshold: 1

## Readiness probe parameters
readinessProbe:
  # -- Enable readiness probe
  enabled: true
  # -- HTTP path for readiness check
  path: /
  # -- Port name or number for readiness check
  port: http
  # -- Delay before first probe
  initialDelaySeconds: 5
  # -- Interval between probes
  periodSeconds: 10
  # -- Probe timeout
  timeoutSeconds: 5
  # -- Failures before marking unready
  failureThreshold: 3
  # -- Successes before marking ready
  successThreshold: 1

## Liveness probe parameters
livenessProbe:
  # -- Enable liveness probe
  enabled: true
  # -- HTTP path for liveness check
  path: /
  # -- Port name or number for liveness check
  port: http
  # -- Delay before first probe
  initialDelaySeconds: 10
  # -- Interval between probes
  periodSeconds: 10
  # -- Probe timeout
  timeoutSeconds: 5
  # -- Failures before restarting
  failureThreshold: 6
  # -- Successes before marking healthy
  successThreshold: 1

## Service parameters
service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Service and container port
  port: 3000

## Gateway API parameters. Everything outside `gateway.nginx` is standard Gateway API
gateway:
  # -- Enable HTTPRoute (Gateway API)
  enabled: false
  # -- Hostnames served by the HTTPRoute; with `listenerSet.create` also one HTTPS listener each and the certificate's DNS names
  hostnames: []
  listenerSet:
    # -- Create the ListenerSet and its cert-manager Certificate. Enable in exactly one release per set of hostnames; other releases attach to it by `name`
    create: false
    # -- ListenerSet the HTTPRoute attaches to. Defaults to this release's own when `create` is true; required otherwise
    name: ""
    # -- Shared Gateway the created ListenerSet attaches to
    gateway:
      name: nginx
      namespace: nginx-gateway
    # -- cert-manager ClusterIssuer for the created Certificate
    certIssuer: cert-manager-gateway
  # -- Additional HTTPRoute annotations
  annotations: {}
  # -- Per-rule HTTPRoute timeouts (`request`, `backendRequest`); set to `null` to use controller defaults
  timeouts:
    request: 900s
    backendRequest: 900s
  ## NGINX Gateway Fabric extensions
  nginx:
    # -- Render the NGINX Gateway Fabric extensions below. Set to `false` on any other Gateway API controller: their CRDs exist only where NGF is installed
    enabled: true
    clientSettings:
      # -- Enable the NGF ClientSettingsPolicy targeting the HTTPRoute
      enabled: true
      # -- Maximum client request body size
      maxBodySize: 15m
      # -- Client request body read timeout
      bodyTimeout: 60s

## ConfigMap parameters
configMap:
  # -- Key-value pairs injected as environment variables via ConfigMap
  env: {}

## Secret parameters
secret:
  # -- Arbitrary key-value pairs rendered as a Kubernetes Secret (values are base64-encoded automatically)
  data: {}

## External Secrets parameters
secretStore:
  # -- Enable SecretStore and ServiceAccount for vault integration
  enabled: false
  # -- SecretStore name
  name: ""
  # -- Vault/OpenBao server URL
  server: ""
  # -- CA provider for TLS verification (type, name, key)
  caProvider: {}
  auth:
    # -- Kubernetes auth role for vault
    role: ""

# -- List of ExternalSecret definitions
externalSecrets: []

## Extra parameters

# -- Additional environment variables
extraEnvVars: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts
extraVolumeMounts: []
# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}
