{{- if and .Values.gateway.enabled .Values.gateway.nginx.enabled .Values.gateway.nginx.clientSettings.enabled }}
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: {{ include "frontend.fullname" . }}-frontend
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "frontend.fullname" . }}-frontend
  body:
    maxSize: {{ .Values.gateway.nginx.clientSettings.maxBodySize | quote }}
    timeout: {{ .Values.gateway.nginx.clientSettings.bodyTimeout | quote }}
{{- end }}
